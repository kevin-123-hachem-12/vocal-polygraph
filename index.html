<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0c0b">
<meta name="description" content="Veritas VP-9: say something about yourself and the machine stamps LIE or TRUTH. A voice lie detector game in English, Arabic and French.">
<meta property="og:title" content="Veritas VP-9 · Can you fool the machine?">
<meta property="og:description" content="Say something about yourself. The machine stamps LIE or TRUTH.">
<meta property="og:image" content="https://kevin-123-hachem-12.github.io/vocal-polygraph/icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vocal Polygraph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Barlow+Condensed:wght@500;600;700&family=Share+Tech+Mono&family=Lalezar&family=Cairo:wght@500;600;700&display=swap">
<style>
/* One machine, centered: brass nameplate, analog gauge, amber readout, chart paper with stamp, big red button. Single dark look by design. */
:root{
  --room:#0d0c0b; --steel-hi:#3a3d40; --steel-lo:#17191b; --bezel:#08090a;
  --brass:#c9a45c; --brass-lo:#7a5f2c; --face:#f1e8d2; --paper:#efe5cb; --grid:#d9c9a3;
  --ink:#1b1a18; --red:#c0261c; --red-hi:#ff5a45; --green:#2f7d3e; --green-hi:#63d17a;
  --blue:#21406b; --amber:#ffb347; --lcd:#170f05; --label:#b9b2a3;
  --stencil:"Big Shoulders Stencil Display",Impact,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Consolas,monospace;
  --stamp:var(--stencil);
  color-scheme:dark;
}
/* Arabic: same machine, Arabic display and body faces. The plate and readout keep their Latin type. */
html[lang="ar"]{--cond:"Cairo",Tahoma,sans-serif;--stamp:"Lalezar","Cairo",sans-serif}
html[lang="ar"] .said{font-size:16px;line-height:1.6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#24201b 0%,var(--room) 70%);background-color:var(--room);color:var(--label);font:16px/1.4 var(--cond);
  display:grid;justify-items:center;align-content:center;gap:12px;min-height:100vh;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px))}
.inapp{width:min(100%,480px);background:var(--amber);color:#2a1a04;border-radius:10px;padding:10px 14px;font:600 15px/1.3 var(--cond)}
.inapp b{display:block;font-size:17px}
.machine{width:min(100%,480px);border-radius:22px;padding:18px 18px 22px;position:relative;display:grid;gap:14px;
  background:linear-gradient(160deg,var(--steel-hi),var(--steel-lo) 60%);
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 -2px 0 rgba(0,0,0,.6) inset,0 30px 60px rgba(0,0,0,.6),0 0 0 1px #000}
.machine::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.gauge,.lcd,.paper,.plate{direction:ltr}
.screw{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9a9a9a,#3a3a3a);box-shadow:0 1px 1px #000}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:2px;background:#222;transform:rotate(35deg)}
.s1{top:9px;left:9px}.s2{top:9px;right:9px}.s3{bottom:9px;left:9px}.s4{bottom:9px;right:9px}
.plate{justify-self:center;display:flex;align-items:center;gap:10px;padding:5px 16px;border-radius:4px;
  background:linear-gradient(180deg,#e2c27e,var(--brass) 45%,var(--brass-lo));color:#2a1e08;box-shadow:0 2px 4px rgba(0,0,0,.6)}
.plate b{font:900 22px/1 var(--stencil);letter-spacing:.12em}
.plate small{font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.2em}
.knob{position:absolute;top:14px;width:34px;height:34px;border-radius:50%;border:1px solid #000;cursor:pointer;z-index:3;padding:0;
  background:radial-gradient(circle at 40% 35%,#55595d,#1d1f21);color:var(--label);display:grid;place-items:center;font:700 13px "Barlow Condensed","Cairo",sans-serif;letter-spacing:.04em}
.gear{right:24px}.langk{left:24px}
.gear svg{width:18px;height:18px}
.gauge{border-radius:14px;padding:10px 10px 0;background:var(--bezel);box-shadow:0 2px 0 rgba(255,255,255,.08),0 0 0 3px #000 inset}
.gauge svg{display:block;width:100%;height:auto}
.lcd{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-radius:6px;background:var(--lcd);
  box-shadow:0 0 0 2px #000,0 2px 6px rgba(0,0,0,.8) inset;font:20px/1 var(--mono);color:var(--amber);text-shadow:0 0 8px rgba(255,179,71,.6);letter-spacing:.06em}
.lamps{display:flex;gap:10px;font:600 10px "Barlow Condensed",sans-serif;letter-spacing:.14em;color:var(--label);text-shadow:none}
.lamp{display:flex;align-items:center;gap:5px}
.lamp i{width:9px;height:9px;border-radius:50%;background:#2a2a2a;box-shadow:0 0 0 1px #000}
.lamp.on.g i{background:var(--green-hi);box-shadow:0 0 8px var(--green-hi)}
.lamp.on.r i{background:var(--red-hi);box-shadow:0 0 10px var(--red-hi);animation:blink 1s steps(2) infinite}
.lamp.on.a i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
@keyframes blink{50%{opacity:.25}}
.paper{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px #000,0 6px 14px rgba(0,0,0,.6) inset}
.paper canvas{display:block;width:100%;height:150px}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:0 8px 16px -8px rgba(0,0,0,.45) inset,0 -8px 16px -8px rgba(0,0,0,.45) inset}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);display:grid;justify-items:center;white-space:nowrap;
  padding:6px 18px 8px;border:5px solid currentColor;border-radius:10px;color:var(--red);opacity:0;pointer-events:none;mix-blend-mode:multiply}
.stamp b{font:900 64px/0.9 var(--stamp);letter-spacing:.06em}
html[lang="ar"] .stamp b{font-weight:400;letter-spacing:0;line-height:1.1}
.stamp.long b{font-size:44px}
.stamp small{font:700 14px var(--cond);letter-spacing:.18em}
.stamp.truth{color:var(--green)}
.stamp.show{animation:stamp .38s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-24deg) scale(2.6)}100%{opacity:.92;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.said{min-height:2.8em;margin:0;text-align:center;color:#e8dfcc;font:500 17px/1.35 var(--cond);overflow-wrap:anywhere}
.said em{display:block;font-style:normal;color:var(--label);font-size:14px;margin-top:2px}
.said a{color:var(--amber)}
.deck{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.deck .side{display:grid;justify-items:center}
.rec{grid-column:2;width:116px;height:116px;border-radius:50%;cursor:pointer;position:relative;border:0;padding:0;
  background:radial-gradient(circle at 50% 50%,#2b2d2f 58%,#0d0e0f 60%,#4a4d50 66%,#1c1d1f 72%);box-shadow:0 6px 14px rgba(0,0,0,.7)}
.rec span{position:absolute;inset:14px;border-radius:50%;display:grid;place-items:center;font:900 22px var(--stencil);letter-spacing:.14em;color:#ffe6e1;
  background:radial-gradient(circle at 38% 30%,#ff8a7a,var(--red) 45%,#6e0f09);box-shadow:0 4px 0 #4a0905,0 8px 12px rgba(0,0,0,.6);transition:transform .08s,box-shadow .08s}
.rec:active span{transform:translateY(3px);box-shadow:0 1px 0 #4a0905,0 3px 6px rgba(0,0,0,.6)}
.rec.live span{animation:glow 1s ease-in-out infinite;transform:translateY(3px);box-shadow:0 1px 0 #4a0905,0 0 28px 6px rgba(255,70,50,.55)}
.rec:disabled{cursor:wait}
.rec:focus-visible,.chip:focus-visible,.knob:focus-visible{outline:3px solid var(--amber);outline-offset:4px}
@keyframes glow{50%{box-shadow:0 1px 0 #4a0905,0 0 44px 14px rgba(255,70,50,.75)}}
.chip{border:1px solid #000;border-radius:999px;padding:7px 12px;cursor:pointer;font:700 12px var(--cond);letter-spacing:.1em;color:#e8dfcc;max-width:130px;
  background:linear-gradient(180deg,#45494d,#222426);box-shadow:0 2px 4px rgba(0,0,0,.6);text-align:center;line-height:1.15}
html[lang="ar"] .chip{letter-spacing:0;font-size:12px;line-height:1.4}
.chip.brass{background:linear-gradient(180deg,#e2c27e,var(--brass) 45%,var(--brass-lo));color:#2a1e08}
.hint{text-align:center;font:600 12px var(--cond);letter-spacing:.22em;color:var(--label);margin-top:-6px}
html[lang="ar"] .hint{letter-spacing:0;font-size:14px}
.fine{text-align:center;font:500 11px var(--cond);letter-spacing:.08em;color:#7d776c;margin:0}
html[lang="ar"] .fine{letter-spacing:0;font-size:12px}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
.rumble{animation:rumble .12s linear infinite}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,2px)}40%,60%{transform:translate(7px,-1px)}}
@keyframes rumble{0%{transform:translate(0,0)}25%{transform:translate(.6px,-.5px)}50%{transform:translate(-.6px,.4px)}75%{transform:translate(.4px,.6px)}}
dialog{border:0;border-radius:16px;padding:0;background:#1d1f21;color:#e8dfcc;width:min(92vw,420px);box-shadow:0 30px 80px #000;font-family:var(--cond)}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog form{display:grid;gap:12px;padding:20px}
dialog h2{margin:0;font:900 28px/1.1 var(--stamp);letter-spacing:.08em;color:var(--brass)}
html[lang="ar"] dialog h2{font-weight:400;letter-spacing:0}
dialog p{margin:0;font-size:15px;color:var(--label)}
dialog label{display:grid;gap:4px;font:600 12px var(--cond);letter-spacing:.14em}
dialog input[type=text]{font:17px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:10px;border-radius:6px;border:1px solid #444;background:#0f1011;color:#fff;width:100%;direction:ltr}
dialog select{font:16px var(--cond);padding:8px;border-radius:6px;border:1px solid #444;background:#0f1011;color:#fff}
.chk{display:flex!important;gap:8px;align-items:center;font-size:15px!important;letter-spacing:.04em!important}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.btn{font:700 15px var(--cond);letter-spacing:.1em;padding:10px 16px;border-radius:6px;border:1px solid #555;background:#2a2c2e;color:#eee;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.go{background:var(--brass);border-color:var(--brass);color:#22180a}
.btn.wide{width:100%;font-size:18px;padding:12px}
.offer{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;padding:14px;border-radius:10px;background:#111213;box-shadow:0 0 0 1px #3a3020}
.offer b{font:900 22px/1.1 var(--stamp);letter-spacing:.06em;color:#f1e8d2}
html[lang="ar"] .offer b{font-weight:400;letter-spacing:0}
.offer .price{font:900 34px/1 var(--stencil);color:var(--brass);direction:ltr}
.offer ul{grid-column:1/-1;margin:0;padding-inline-start:18px;font-size:15px;color:var(--label)}
.tiny{font-size:12px!important;color:#857e70!important}
.msg{min-height:1.2em;font:14px var(--cond);color:var(--amber)}
@media (max-height:720px){.paper canvas{height:110px}.rec{width:96px;height:96px}.stamp b{font-size:52px}.stamp.long b{font-size:38px}}
@media (prefers-reduced-motion:reduce){.shake,.rumble,.rec.live span,.lamp.on.r i{animation:none}}
</style>
</head>
<body>
<div class="inapp" id="inapp" hidden><b id="inappT"></b><span id="inappB"></span></div>
<main class="machine" id="machine">
  <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
  <div class="plate"><b>VERITAS</b><small>VOICE POLYGRAPH · VP-9</small></div>
  <button class="knob langk" id="langBtn" aria-label="Language">EN</button>
  <button class="knob gear" id="gearBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.7a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7 7 0 0 0 1.7 1L11 21h4l.4-2.7a7 7 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>

  <div class="gauge">
    <svg viewBox="0 0 300 172" aria-hidden="true">
      <defs>
        <radialGradient id="face" cx="50%" cy="100%" r="100%"><stop offset="0" stop-color="#fbf5e6"/><stop offset="1" stop-color="#dccfae"/></radialGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
      <path d="M8 168 A142 142 0 0 1 292 168 Z" fill="url(#face)"/>
      <g id="zones" fill="none" stroke-width="12"></g>
      <g id="ticks" stroke="#1b1a18"></g>
      <text id="gTruth" x="40" y="150" fill="#2f7d3e" style="font:900 20px var(--stamp);letter-spacing:.08em">TRUTH</text>
      <text id="gLie" x="260" y="150" text-anchor="end" fill="#c0261c" style="font:900 20px var(--stamp);letter-spacing:.08em">LIE</text>
      <text x="150" y="122" text-anchor="middle" fill="#6b6150" style="font:600 10px 'Barlow Condensed',sans-serif;letter-spacing:.3em">DECEPTION INDEX</text>
      <g id="needle"><path d="M148.4 160 L150 32 L151.6 160 Z" fill="#b3261e"/><path d="M147 160 h6 v12 h-6z" fill="#1b1a18"/></g>
      <circle cx="150" cy="160" r="11" fill="#1b1a18"/><circle cx="150" cy="160" r="4" fill="#c9a45c"/>
      <path d="M8 168 A142 142 0 0 1 292 168 Z" fill="url(#glass)"/>
    </svg>
  </div>

  <div class="lcd"><span id="lcd">READY</span>
    <span class="lamps"><span class="lamp g on" id="lPow"><i></i>PWR</span><span class="lamp r" id="lRec"><i></i>REC</span><span class="lamp a" id="lAi"><i></i>AI</span></span>
  </div>

  <div class="paper"><canvas id="strip"></canvas>
    <div class="stamp" id="stamp"><b id="stampWord">LIE</b><small id="stampPct"></small></div>
  </div>

  <p class="said" id="said"></p>

  <div class="deck">
    <div class="side"><button class="chip brass" id="creditsBtn"><span id="aiLabel"></span><br><span id="credits"></span></button></div>
    <button class="rec" id="recBtn" aria-label="Record"><span>REC</span></button>
    <div class="side"><button class="chip" id="shareBtn" hidden></button></div>
  </div>
  <div class="hint" id="hint"></div>
  <p class="fine" id="fine"></p>
</main>

<dialog id="shop">
  <form method="dialog">
    <h2 id="shopTitle"></h2>
    <p id="shopIntro"></p>
    <div class="offer">
      <b id="packName"></b><span class="price">$2.99</span>
      <ul id="perks"></ul>
    </div>
    <a class="btn go wide" id="buyBtn" target="_blank" rel="noopener"></a>
    <p class="tiny" id="buyNote"></p>
    <label for="codeIn"><span id="haveCode"></span><input type="text" id="codeIn" autocomplete="off" spellcheck="false" placeholder="VP9-XXXX-XXXX" maxlength="13"></label>
    <div class="msg" id="codeMsg" aria-live="polite"></div>
    <div class="btns"><button class="btn" value="close" id="closeBtn"></button><button class="btn go" id="redeemBtn" type="button"></button></div>
    <p class="tiny" id="shopFine"></p>
  </form>
</dialog>

<dialog id="settings">
  <form method="dialog">
    <h2 id="setTitle"></h2>
    <label for="langIn"><span id="langLabel"></span>
      <select id="langIn"><option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option></select>
    </label>
    <label class="chk"><input type="checkbox" id="soundIn" checked> <span id="soundLabel"></span></label>
    <label class="chk"><input type="checkbox" id="vibeIn" checked> <span id="vibeLabel"></span></label>
    <p id="codeLine"></p>
    <div class="btns"><button class="btn" id="forgetBtn" type="button" hidden></button><button class="btn go" value="save" id="doneBtn"></button></div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const JUDGE_URL = "https://vocal-polygraph-judge.kevinhachem23.workers.dev";
const APP_URL = "kevin-123-hachem-12.github.io/vocal-polygraph";
const INSTAGRAM = "veritasvp9";
const BUY_URL = ""; // hosted checkout link, once a payment provider is set up
const FREE = 10;     // must match FREE_DAILY in worker/wrangler.toml

/* ---------------- words in three languages ---------------- */
const T = {
  en: {
    intro: "Press the red button and say something about yourself.", example: "“I've never eaten food off the floor.”",
    listening: "Listening…", hintRec: "PRESS TO RECORD", hintStop: "PRESS TO STOP", hintBusy: "ANALYZING", hintAgain: "PRESS TO RECORD AGAIN",
    aiLabel: "AI VERDICTS", free: n => `${n} FREE TODAY`, left: n => `${n} LEFT`, more: "GET MORE", share: "SHARE<br>VERDICT",
    fine: "For entertainment. No machine can truly read a lie.",
    inappT: "Open in your browser to use the mic", inappB: "Tap ••• at the top, then “Open in external browser”.",
    noMic: "This browser can't reach a microphone. Try Chrome, Edge or Safari.",
    micOff: "Microphone access is off.", micHelp: "Allow the mic in your browser's address bar, then press again.",
    heardNothing: "The machine heard nothing.", heardHelp: "Speak up, closer to the mic, for at least two seconds.",
    mumble: "(Couldn't make out the words, judging the voice.)",
    byClaude: "judged by Claude", byMachine: "machine verdict", limit: "Free Claude verdicts used up today. Get more →",
    lie: "LIE", truth: "TRUTH", certain: n => `${n}% CERTAIN`,
    shopTitle: "GET CLAUDE VERDICTS", shopIntro: "Every reading gets a verdict from the machine. Claude, Anthropic's AI, also reads your words and voice for a sharper call.",
    pack: "INTERROGATION PACK", perks: ["100 extra Claude verdicts", "Never expire, use them at any pace", `On top of ${FREE} free Claude verdicts every day`],
    buy: "BUY THE PACK", buyIg: "BUY ON INSTAGRAM", buyNoteUrl: "After paying you'll get a code. Enter it below.", buyNoteIg: h => `Message @${h} to buy. You'll get a code to enter below.`,
    haveCode: "HAVE A CODE?", close: "Close", redeem: "Redeem code", shopFine: "For entertainment only. Verdicts are a game, not real lie detection.",
    codeFormat: "Codes look like VP9-ABCD-1234.", checking: "Checking…", notFound: "That code wasn't found. Check it and try again.",
    unlocked: n => `Unlocked. ${n} Claude verdicts ready.`, offline: "No connection. Try again in a moment.",
    settings: "SETTINGS", language: "LANGUAGE", sound: "Machine sounds", vibe: "Vibration (Android)",
    codeOn: (c, n) => `Pack code: ${c} (${n} verdicts left)`, noCode: "No pack code on this device.", removeCode: "Remove code", removed: "Code removed from this device.", done: "Done",
    cardTop: "THE VOICE POLYGRAPH HAS SPOKEN", cardCta: "CAN YOU FOOL THE MACHINE?", cardFine: "For entertainment only", cardMumble: "(the words were a mumble)",
    shareText: v => `The machine says ${v}. Try it:`,
    cues: { insist: "over-insisting", certain: "too much certainty", hedge: "hedging", filler: "filler words", denial: "a flat denial", shaky: "a shaky pitch", jumpy: "a jumpy voice", pauses: "long pauses", slow: "a slow start" },
    lie2: (a, b) => `Gave it away with ${a} and ${b}.`, lie1: a => `Gave it away with ${a}.`, lie0: "Something in that voice didn't sit right.",
    truth1: a => `Some ${a}, but the story holds up.`, truth0: "Steady voice, clean story."
  },
  ar: {
    intro: "اكبس الزر الأحمر وقول شي عن حالك.", example: "«عمري ما أكلت شي وقع عالأرض.»",
    listening: "عم يسمع…", hintRec: "اكبس لتسجّل", hintStop: "اكبس لتوقّف", hintBusy: "عم يحلّل", hintAgain: "اكبس لتسجّل مرة تانية",
    aiLabel: "أحكام الذكاء", free: n => `${n} ببلاش اليوم`, left: n => `باقي ${n}`, more: "زيد", share: "شارك<br>الحكم",
    fine: "للتسلية بس. ما في آلة بتكشف الكذب عن جد.",
    inappT: "افتح بالمتصفح ليشتغل المايك", inappB: "اكبس ••• فوق، وبعدين «فتح في المتصفح».",
    noMic: "هالمتصفح ما بيقدر يوصل للمايك. جرّب Chrome أو Safari.",
    micOff: "المايك مسكّر.", micHelp: "اسمح بالمايك من شريط العنوان، وبعدين اكبس مرة تانية.",

  let t = "";

    const v = i / 50, big = i % 5 === 0, [x1, y1] = pt(v, 114), [x2, y2] = pt(v, big ? 100 : 107);

  paperSlice(W - s, s);

    live.pitch ? .3 - Math.max(-.22, Math.min(.22, (live.pitch - 160) / 500)) : .3,
    .62 - live.loud * .22,

/* ---------------- voice analysis ---------------- */
function detectPitch(buf, sr) {
  const n = buf.length, minLag = Math.floor(sr / 400), maxLag = Math.min(Math.ceil(sr / 70), n - 64);
  const r = new Float32Array(maxLag + 2); let best = 0;
  for (let lag = minLag; lag <= maxLag; lag++) {

    for (let i = 0; i < n - lag; i++) { const a = buf[i], b = buf[i + lag]; s += a * b; e1 += a * a; e2 += b * b; }
    r[lag] = e1 && e2 ? s / Math.sqrt(e1 * e2) : 0; if (r[lag] > best) best = r[lag];
  }
  if (best < .55) return 0;
  for (let lag = minLag + 1; lag < maxLag; lag++)
    if (r[lag] >= .9 * best && r[lag] >= r[lag - 1] && r[lag] >= r[lag + 1]) {
      const a = r[lag - 1], b = r[lag], c = r[lag + 1], d = a - 2 * b + c;
      return sr / (lag + (d ? .5 * (a - c) / d : 0));
    }

}

  return { y, s: sr / 2 };
}

const std = a => { const m = mean(a); return Math.sqrt(mean(a.map(v => (v - m) ** 2))); };

  const p = rms.map((v, k) => v > thr ? detectPitch(y.subarray(k * hop, k * hop + N), s) : 0);

  return {
    pitchHz: Math.round(med),
    pitchRangeSemitones: +std(vp.map(f => semi(f, med)).filter(v => Math.abs(v) < 12)).toFixed(2),
    tremorSemitones: +mean(jit).toFixed(3),
    pauseShare: +(silent / (last - first + 1)).toFixed(2),
    secondsBeforeSpeaking: +(first * hop / s).toFixed(2),
    durationSeconds: +(x.length / sr).toFixed(1)

}

async function refreshBalance() {
  try {
    const { status, data } = await helper("/status", { code: cfg.code || undefined }, 8000);
    if (status === 404 || data.error === "bad_code") { cfg.code = ""; store.set("code", ""); ai.credits = null; showCredits(); return; }
    if (status === 200) takeCounts(data);
  } catch {}
}
async function aiJudge(text, f) {
  if (ai.freeLeft <= 0 && !(ai.credits > 0)) return { limited: true };
  try {
    const { status, data } = await helper("/judge", { transcript: text, voice: f, code: cfg.code || undefined, lang: cfg.lang });
    if (status === 429) { takeCounts(data); return { limited: true }; }
    if (status !== 200) throw new Error(data.error || "HTTP " + status);
    takeCounts(data);
    return { verdict: data.verdict, confidence: data.confidence, reason: data.reason, by: "claude" };
  } catch (e) { console.warn("Claude verdict failed:", e); return null; }
}

/* ---------------- recording flow ---------------- */
let stream, nodes, chunks = [], recog = null, transcript = "", t0 = 0, beat = 0;
const lcd = t => $("#lcd").textContent = t;
function setLamps() { $("#lRec").classList.toggle("on", state === "rec"); }
function setHint() { setText("#hint", hintFor()); }
function startRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  transcript = ""; recog = null;
  if (!SR) return;
  try {
    const r = new SR(); r.lang = SPEECH[cfg.lang]; r.continuous = true; r.interimResults = true;
    let finals = "";
    r.onresult = e => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        e.results[i].isFinal ? finals += t + " " : interim += t;
      }
      transcript = (finals + interim).trim();
      if (state === "rec") $("#said").textContent = transcript ? quote(transcript) : L.listening;
    };
    r.onerror = () => {};
    r.start(); recog = r;
  } catch { recog = null; }
}
function stopRecognition() {
  return new Promise(res => {
    if (!recog) return res();
    const done = () => { clearTimeout(tm); res(); };
    const tm = setTimeout(done, 1500);
    recog.onend = done;
    try { recog.stop(); } catch { done(); }
  });
}
function twoLine(main, sub) { const p = $("#said"); p.textContent = main; const em = document.createElement("em"); em.textContent = sub; p.append(em); }

async function startRec() {
  await audio();
  if (!navigator.mediaDevices?.getUserMedia) { lcd("NO MIC"); $("#said").textContent = L.noMic; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
  } catch { lcd("MIC BLOCKED"); twoLine(L.micOff, L.micHelp); return; }
  const src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser(), pr = ctx.createScriptProcessor(4096, 1, 1), mute = ctx.createGain();
  an.fftSize = 2048; mute.gain.value = 0;
  src.connect(an); src.connect(pr); pr.connect(mute); mute.connect(ctx.destination);
  chunks = []; pr.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  nodes = { src, an, pr, mute, buf: new Float32Array(2048), prevPitch: 0 };
  $("#stamp").className = "stamp"; $("#shareBtn").hidden = true; lastVerdict = null;
  $("#said").textContent = L.listening;
  startRecognition();
  state = "rec"; t0 = performance.now();
  $("#recBtn").classList.add("live");
  setHint(); clack(); humOn(); buzz(40); setLamps();
  needle.target = .12; needle.wild = 0;
  beat = setInterval(() => buzz([25, 110, 25]), 950);
}

async function stopRec() {
  if (state !== "rec") return;
  state = "analyzing"; clearInterval(beat);
  const { src, an, pr, mute } = nodes;
  pr.onaudioprocess = null; [src, an, pr, mute].forEach(n => n.disconnect());
  stream.getTracks().forEach(t => t.stop());
  live.loud = live.pitch = live.trem = 0;
  $("#recBtn").classList.remove("live"); $("#recBtn").disabled = true;
  setHint(); setLamps(); clack();
  lcd("ANALYZING"); needle.wild = 1; needle.target = .5; shake("rumble");

  await stopRecognition();
  const total = chunks.reduce((a, c) => a + c.length, 0), x = new Float32Array(total);
  let o = 0; for (const c of chunks) { x.set(c, o); o += c.length; }
  const f = analyze(x, ctx.sampleRate);
  const text = transcript.trim();

  if (!f && !text) { finishNoSpeech(); return; }
  $("#said").textContent = text ? quote(text) : L.mumble;
  const minWait = new Promise(r => setTimeout(r, 1800));
  const [res] = await Promise.all([aiJudge(text, f), minWait]);
  const v = res && !res.limited ? res : localJudge(text, f);
  verdict({ ...v, text, limited: !!res?.limited });
}

function finishNoSpeech() {
  state = "idle"; needle.wild = 0; needle.target = .08;
  $("#machine").classList.remove("rumble"); humOff();
  $("#recBtn").disabled = false; setHint(); setLamps();
  lcd("NO SPEECH"); twoLine(L.heardNothing, L.heardHelp);
}

function paintVerdictText(v) {
  const lie = v.verdict === "LIE", word = lie ? L.lie : L.truth;
  setText("#stampWord", word); setText("#stampPct", L.certain(v.confidence));
  $("#stamp").classList.toggle("long", word.length > 5);
  const said = $("#said"); said.innerHTML = ""; if (v.text) said.append(quote(v.text));
  const em = document.createElement("em");
  em.textContent = (v.by === "claude" ? v.reason : machineReason(v)) + "  · " + (v.by === "claude" ? L.byClaude : L.byMachine);
  said.append(em);
  if (v.limited) {
    const up = document.createElement("em"); const a = document.createElement("a");
    a.href = "#"; a.textContent = L.limit; a.onclick = e => { e.preventDefault(); openShop(); };
    up.append(a); said.append(up);
  }
}

function verdict(v) {
  const lie = v.verdict === "LIE";
  needle.wild = 0;
  needle.target = lie ? .5 + (v.confidence - 50) / 100 : .5 - (v.confidence - 50) / 100;
  needle.vel += lie ? .12 : -.12;
  $("#machine").classList.remove("rumble"); humOff();
  setTimeout(() => {
    lastVerdict = v; state = "idle";
    paintVerdictText(v);
    $("#stamp").classList.add("show"); $("#stamp").classList.toggle("truth", !lie);
    lcd(lie ? `DECEPTION ${v.confidence}%` : `TRUTHFUL ${v.confidence}%`);
    tone({ type: "sine", f: 90, f2: 40, dur: .25, vol: .5 }); clack();
    if (lie) {
      tone({ type: "sawtooth", f: 150, dur: .7, vol: .12, delay: .12 }); tone({ type: "square", f: 145, dur: .7, vol: .06, delay: .12 });
      buzz([300, 80, 300, 80, 600]); shake();
    } else {
      tone({ type: "sine", f: 880, dur: .9, vol: .15, delay: .1 }); tone({ type: "sine", f: 1320, dur: .9, vol: .08, delay: .18 });
      buzz([60]);
    }
    $("#recBtn").disabled = false; setHint(); setLamps();
    $("#shareBtn").hidden = false;
  }, 420);
}

$("#recBtn").onclick = () => state === "idle" ? startRec() : state === "rec" ? stopRec() : null;

/* ---------------- share card for Instagram Stories ---------------- */
function wrapLines(c, text, maxW) {
  const words = text.split(/\s+/), lines = []; let line = "";
  for (const w of words) { const t = line ? line + " " + w : w; if (c.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}
function fitFont(c, text, weight, size, family, maxW) {
  let s = size; c.font = `${weight} ${s}px ${family}`;
  while (c.measureText(text).width > maxW && s > 40) { s -= 6; c.font = `${weight} ${s}px ${family}`; }
}
async function shareCard() {
  if (!lastVerdict) return;
  await document.fonts.ready;
  const v = lastVerdict, lie = v.verdict === "LIE", ink = lie ? "#d23a2e" : "#3f9a51", ar = cfg.lang === "ar";
  const DISP = ar ? '"Lalezar", "Cairo", sans-serif' : '"Big Shoulders Stencil Display", Impact, sans-serif';
  const BODY = ar ? '"Cairo", Tahoma, sans-serif' : '"Barlow Condensed", sans-serif';
  const dw = ar ? "400" : "900";
  const c = document.createElement("canvas"); c.width = 1080; c.height = 1920;
  const x = c.getContext("2d");
  x.direction = ar ? "rtl" : "ltr";
  const bg = x.createRadialGradient(540, 300, 100, 540, 900, 1300); bg.addColorStop(0, "#2a2520"); bg.addColorStop(1, "#0b0a09");
  x.fillStyle = bg; x.fillRect(0, 0, 1080, 1920);
  x.textAlign = "center";
  const pg = x.createLinearGradient(0, 150, 0, 250); pg.addColorStop(0, "#e2c27e"); pg.addColorStop(.5, "#c9a45c"); pg.addColorStop(1, "#7a5f2c");
  x.fillStyle = pg; x.beginPath(); x.roundRect(240, 150, 600, 110, 10); x.fill();
  x.fillStyle = "#2a1e08"; x.font = '900 72px "Big Shoulders Stencil Display", Impact'; x.fillText("VERITAS VP-9", 540, 230);
  x.fillStyle = "#b9b2a3"; x.font = `600 36px ${BODY}`; x.fillText(L.cardTop, 540, 330);
  x.fillStyle = "#efe5cb"; x.beginPath(); x.roundRect(90, 420, 900, 620, 18); x.fill();
  x.fillStyle = "#d9c9a3"; for (let y = 440; y < 1030; y += 24) x.fillRect(90, y, 900, (y / 24) % 5 === 0 ? 2 : 1);
  x.save(); x.translate(540, 730); x.rotate(-0.2);
  x.strokeStyle = ink; x.lineWidth = 14; x.beginPath(); x.roundRect(-340, -175, 680, 350, 26); x.stroke();
  x.fillStyle = ink; fitFont(x, lie ? L.lie : L.truth, dw, 230, DISP, 600); x.fillText(lie ? L.lie : L.truth, 0, 60);
  x.font = `700 50px ${BODY}`; x.fillText(L.certain(v.confidence), 0, 140);
  x.restore();
  x.fillStyle = "#f1e8d2"; x.font = `600 56px ${BODY}`;
  wrapLines(x, v.text ? quote(v.text) : L.cardMumble, 900).slice(0, 4).forEach((l, i) => x.fillText(l, 540, 1160 + i * 72));
  x.fillStyle = "#b9b2a3"; x.font = `500 40px ${BODY}`;
  wrapLines(x, v.by === "claude" ? v.reason : machineReason(v), 880).slice(0, 2).forEach((l, i) => x.fillText(l, 540, 1480 + i * 56));
  x.fillStyle = "#ffb347"; fitFont(x, L.cardCta, dw, 70, DISP, 940); x.fillText(L.cardCta, 540, 1690);
  x.direction = "ltr";
  x.fillStyle = "#e8dfcc"; x.font = '400 36px "Share Tech Mono", monospace'; x.fillText(`@${INSTAGRAM}`, 540, 1760);
  x.direction = ar ? "rtl" : "ltr";
  x.fillStyle = "#7d776c"; x.font = `500 28px ${BODY}`; x.fillText(L.cardFine, 540, 1830);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  const file = new File([blob], `veritas-${lie ? "lie" : "truth"}.png`, { type: "image/png" });
  try {
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], text: `${L.shareText(lie ? L.lie : L.truth)} https://${APP_URL}` }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
$("#shareBtn").onclick = shareCard;

/* ---------------- shop & settings ---------------- */
function openShop() {
  const b = $("#buyBtn");
  if (BUY_URL) { b.href = BUY_URL; b.textContent = L.buy; setText("#buyNote", L.buyNoteUrl); }
  else { b.href = `https://ig.me/m/${INSTAGRAM}`; b.textContent = L.buyIg; setText("#buyNote", L.buyNoteIg(INSTAGRAM)); }
  $("#codeIn").value = cfg.code; setText("#codeMsg", "");
  $("#shop").showModal();
}
$("#creditsBtn").onclick = openShop;
$("#codeIn").oninput = e => {
  let v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (v.startsWith("VP9")) v = v.slice(3);
  v = v.slice(0, 8);
  e.target.value = v ? "VP9-" + v.slice(0, 4) + (v.length > 4 ? "-" + v.slice(4) : "") : "";
};
$("#redeemBtn").onclick = async () => {
  const code = $("#codeIn").value.trim().toUpperCase();
  if (!/^VP9-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)) { setText("#codeMsg", L.codeFormat); return; }
  setText("#codeMsg", L.checking);
  try {
    const { status, data } = await helper("/status", { code }, 10000);
    if (status !== 200) { setText("#codeMsg", L.notFound); return; }
    cfg.code = code; store.set("code", code); takeCounts(data);
    setText("#codeMsg", L.unlocked(data.credits));
    setTimeout(() => $("#shop").close(), 1200);
  } catch { setText("#codeMsg", L.offline); }
};
$("#gearBtn").onclick = () => {
  $("#soundIn").checked = cfg.sound; $("#vibeIn").checked = cfg.vibe; $("#langIn").value = cfg.lang;
  setText("#codeLine", cfg.code ? L.codeOn(cfg.code, ai.credits ?? "?") : L.noCode);
  $("#forgetBtn").hidden = !cfg.code;
  $("#settings").showModal();
};
$("#langIn").onchange = e => { store.set("lang", e.target.value); applyLang(e.target.value); setText("#codeLine", cfg.code ? L.codeOn(cfg.code, ai.credits ?? "?") : L.noCode); };
$("#forgetBtn").onclick = () => { cfg.code = ""; store.set("code", ""); ai.credits = null; showCredits(); setText("#codeLine", L.removed); $("#forgetBtn").hidden = true; };
$("#settings").addEventListener("close", () => {
  cfg.sound = $("#soundIn").checked; cfg.vibe = $("#vibeIn").checked;
  store.set("sound", cfg.sound); store.set("vibe", cfg.vibe);
});

/* ---------------- main loop ---------------- */
let lastTick = 0;
function frame(now) {
  if (state === "rec" && nodes) {
    nodes.an.getFloatTimeDomainData(nodes.buf);
    const r = rmsOf(nodes.buf), { y, s } = decimate(nodes.buf, ctx.sampleRate);
    const p = r > .012 ? detectPitch(y, s) : 0;
    live.loud = Math.min(1, r * 7);
    live.trem = p && nodes.prevPitch ? Math.min(1, Math.abs(semi(p, nodes.prevPitch)) / 2) : live.trem * .8;
    live.pitch = p; nodes.prevPitch = p;
    needle.target = .1 + live.loud * .35 + live.trem * .25;
    const sec = (now - t0) / 1000;
    lcd(`REC ${sec.toFixed(1)}s ${p ? Math.round(p) + "HZ" : "---HZ"}`);
    if (sec > 20) stopRec();
    if (needle.pos > .3 && now - lastTick > 140) { clack(); lastTick = now; }
  } else if (state === "analyzing") {
    live.pitch = 160 + Math.sin(now / 70) * 120 * Math.random(); live.loud = Math.random() * .8; live.trem = Math.random();
  }
  stepNeedle(now);
  stepStrip(state === "idle" ? 1 : 2.5);
  requestAnimationFrame(frame);
}

addEventListener("resize", sizeStrip);
applyLang(cfg.lang); sizeStrip(); setLamps(); refreshBalance();
requestAnimationFrame(frame);
</script>
